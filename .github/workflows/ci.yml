name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-check:
    name: Block accidental Festify commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if .reference/ contains tracked files
        run: |
          set -euo pipefail
          tracked=$(git ls-files .reference/ | wc -l)
          if [ "$tracked" -ne 0 ]; then
            echo "ERROR: $tracked file(s) tracked under .reference/. Festify reference must remain gitignored."
            git ls-files .reference/
            exit 1
          fi
  web:
    name: web (check + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Check
        run: bun run check
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
  api:
    name: api (vet + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -race -count=1
