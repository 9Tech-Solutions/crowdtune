version: "2"
sql:
  - schema: ../../infra/migrations
    queries: internal/db/queries
    engine: postgresql
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: true
        emit_db_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        # user_id columns hold Better-Auth UUIDs but enter the system as the
        # JWT sub claim (Go string). pgx accepts a string for a uuid
        # parameter and scans uuid into a string. Override the default
        # pgtype.UUID mapping per column so handlers stay string-typed.
        overrides:
          - column: spotify_credentials.user_id
            go_type: string
          - column: parties.host_user_id
            go_type: string
          - column: user_votes.user_id
            go_type: string
