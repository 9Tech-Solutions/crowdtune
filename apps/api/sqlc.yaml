version: "2"
sql:
  - schema: ../../infra/migrations
    queries: internal/db/queries
    engine: postgresql
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: true
        emit_db_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
